# Photo Studio AI — Cloudflare Workers (Modo Free Tier 100% Gratuito)
name = "photo-studio"
main = "src/index.ts"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://photo-studio.pages.dev"
ADMIN_EMAILS = "apacessoria25@gmail.com"
ASAAS_BASE_URL = "https://api-sandbox.asaas.com/v3"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
EMAIL_FROM = "Photo Studio AI <exemplo25@gmail.com>"

[[d1_databases]]
binding = "DB"
database_name = "alegon-photo-db"
database_id = "856d1299-cd62-4d1d-b03f-cf584a444378"
migrations_dir = "migrations"

[triggers]
crons = ["0 3 * * *", "*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
