<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sem Conexão — Photo Studio AI</title>
    <meta name="theme-color" content="#090B10" />
    <style>
      :root {
        --bg: #090B10;
        --card: #11141D;
        --text: #F8FAFC;
        --subtext: #94A3B8;
        --primary: #6366F1;
        --border: #23283A;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 28px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .icon-container {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-container svg {
        width: 36px;
        height: 36px;
        color: white;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        color: var(--subtext);
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px 20px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
      .tip {
        margin-top: 18px;
        font-size: 12px;
        color: var(--subtext);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Sem conexão com a internet</h1>
      <p>
        Você está offline no momento. Assim que seu dispositivo restabelecer o sinal de rede ou Wi-Fi, o Photo Studio AI voltará a funcionar normalmente.
      </p>
      <button class="btn" onclick="window.location.reload()">
        Tentar Novamente
      </button>
      <div class="tip">
        O Photo Studio AI é compatível com uso como aplicativo nativo no iPhone e Android.
      </div>
    </div>
  </body>
</html>
