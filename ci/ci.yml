name: CI - ALEGON AI Photo Studio

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  validate:
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan secrets
        run: node scripts/check-secrets.mjs

      - name: Typecheck Backend (Cloudflare Worker)
        run: npm run typecheck -w apps/api

      - name: Typecheck Frontend (React Web)
        run: npm run typecheck -w apps/web

      - name: Build Frontend SPA
        run: npm run build -w apps/web
